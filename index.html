  --fg:#16201c; --muted:#5c6b64;
  --accent:#0d6b55; --accent-fg:#ffffff; --accent-soft:#d9eee6;
  --out:#b4402a; --out-soft:#f6ddd6;
  --warn:#8a5a00; --warn-soft:#f5e8c8;
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#171f1b; --surface-2:#1f2924; --line:#2c3832;
  --fg:#e7eeea; --muted:#93a39a;
  --accent:#4cc6a2; --accent-fg:#06231a; --accent-soft:#17352b;
  --out:#f08a72; --out-soft:#3a1f19;
  --warn:#e6b84f; --warn-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#171f1b; --surface-2:#1f2924; --line:#2c3832;
  --fg:#e7eeea; --muted:#93a39a;
  --accent:#4cc6a2; --accent-fg:#06231a; --accent-soft:#17352b;
  --out:#f08a72; --out-soft:#3a1f19;
  --warn:#e6b84f; --warn-soft:#3a2f12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn.icon{padding:7px 11px}
.btn.small{min-height:30px;padding:3px 10px;font-size:13px}
.btn.danger{color:var(--out)}

.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:18px}
.hero .main .cap{color:var(--muted);font-size:13px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}

.stat .v.in{color:var(--accent)} .stat .v.outc{color:var(--out)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:16px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick input{flex:1 1 220px;min-width:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t b{font-weight:500;display:block;overflow-wrap:anywhere}
.row .t span{color:var(--muted);font-size:12.5px}
.amt{font-family:var(--f-display);font-weight:600}
.amt.in{color:var(--accent)} .amt.outc{color:var(--out)}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.late{background:var(--out-soft);color:var(--out)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input{flex:1 1 160px}.filters select{flex:0 1 160px}

.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-display)}

.bud{display:grid;grid-template-columns:100px 1fr 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}

.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--out)}
.bud .meta{font-size:12px;color:var(--muted);grid-column:2}
.bud input{min-height:34px;padding:4px 8px}
@media (max-width:520px){.bud{grid-template-columns:1fr 100px}.bud .bar,.bud .meta{grid-column:1/-1}}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)}
.chart .b.max{fill:var(--out)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.delta.up{color:var(--out)} .delta.down{color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:start;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.scroll{overflow-x:auto}

.thumb{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0;width:44px;height:44px;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:78vh;border-radius:8px;background:#fff}
.lb .bar2{display:flex;gap:8px}
.tr{background:var(--surface-2);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap;max-height:42vh;overflow:auto;text-align:start;width:100%}
.lb .tr{max-width:560px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);z-index:20}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

.swatches{display:inline-flex;gap:6px;align-items:center}

    const sh=Math.min(srcTile,H-y),c=document.createElement('canvas');c.width=tw;c.height=Math.round(sh*k);
    c.getContext('2d').drawImage(bmp,0,y,W,sh,0,0,c.width,c.height);blobs.push(await enc(c));

}
async function toDataUrl(file){
  let dim=1000,q=0.7,url='';
  const bmp=await createImageBitmap(file);
  for(let n=0;n<4;n++){
    const k=Math.min(1,dim/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    url=c.toDataURL('image/jpeg',q);
    if(url.length<180000)break;
    dim=Math.round(dim*0.75);q=Math.max(0.5,q-0.07);
  }
  return url;
}

    ${donutPanel(T)}${trendPanel()}<div class="panel"><h2>${L('الفئات مقارنة بالشهر السابق','Kategorier jämfört med förra månaden','Categories compared with last month')}</h2><div class="scroll"><table><thead><tr><th>${L('الفئة','Kategori','Category')}</th><th>${L('المبلغ','Belopp','Amount')}</th><th>${L('الحصة','Andel','Share')}</th><th>${L('التغير','Förändring','Change')}</th></tr></thead><tbody>${catRows}</tbody></table></div></div>
    <div class="panel"><h2>${L('أكبر خمس مصروفات','Fem största utgifterna','Five largest expenses')}</h2><div class="list">${top.map(x=>`<div class="row" style="grid-template-columns:1fr auto"><div class="t"><b>${esc(x.note||cn(x.category))}</b><span>${esc(cn(x.category))} · ${fmtDay(x.date)}</span></div><div class="amt outc">${money(x.amount)}</div></div>`).join('')}</div></div>`;
}


/* ---------- colors, charts, tips ---------- */
const NEEDS=['سكن','فواتير','بقالة','مواصلات','صحة','تعليم'],WANTS=['مطاعم','تسوق','ترفيه','أخرى'];
const CAT_ICON={'بقالة':'🛒','مطاعم':'🍽️','مواصلات':'🚌','سكن':'🏠','فواتير':'🧾','صحة':'💊','تسوق':'🛍️','ترفيه':'🎬','تعليم':'🎓','أخرى':'📦','راتب':'💼','عمل حر':'💻','هدية':'🎁'};
const CAT_IDX={'بقالة':1,'مطاعم':2,'مواصلات':3,'سكن':4,'فواتير':5,'صحة':6,'تسوق':7,'ترفيه':8,'تعليم':9,'أخرى':10,'راتب':1,'عمل حر':2,'هدية':3};
const cc=c=>`var(--c${CAT_IDX[c]||10})`;
function donutPanel(T){
  const cats=Object.entries(T.byCat).sort((a,b)=>b[1]-a[1]);
  if(!cats.length||!T.out)return '';
  let off=25,segs='';
  cats.forEach(([c,v])=>{const pct=v/T.out*100;segs+=`<circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:${cc(c)}" stroke-width="6" stroke-dasharray="${pct.toFixed(3)} ${(100-pct).toFixed(3)}" stroke-dashoffset="${off.toFixed(3)}"/>`;off-=pct});
  const legend=cats.map(([c,v])=>`<div class="lg"><i class="dot" style="background:${cc(c)}"></i><span>${cn(c)}</span><b class="num">${Math.round(v/T.out*100)}%</b></div>`).join('');
  return `<div class="panel"><h2>${L('توزيع المصروفات','Utgifternas fördelning','Spending breakdown')}</h2><div class="donutwrap"><svg viewBox="0 0 42 42" class="donut" role="img" aria-label="${L('توزيع المصروفات حسب الفئة','Utgifter per kategori','Spending by category')}"><circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:var(--surface-2)" stroke-width="6"/>${segs}<text x="21" y="20.6" text-anchor="middle" style="font-size:3.4px;fill:var(--fg);font-weight:600" direction="ltr">${NF(T.out)}</text><text x="21" y="25" text-anchor="middle" style="font-size:2.6px;fill:var(--muted)">${esc(S.settings.currency)}</text></svg><div class="legend">${legend}</div></div></div>`;
}
function trendPanel(){
  const y=+S.ym.slice(0,4),m=+S.ym.slice(5),ms=[];
  for(let i=5;i>=0;i--)ms.push(ymOf(new Date(y,m-1-i,1)));
  const data=ms.map(ym=>{const T=totals(ym);return {ym,inc:T.inc,out:T.out}});
  if(data.every(d=>!d.inc&&!d.out))return '';
  const mx=Math.max(...data.flatMap(d=>[d.inc,d.out]),1),W=640,H=160,B=22,L0=8,gw=(W-2*L0)/6;
  const px=i=>sv()?L0+i*gw:W-L0-(i+1)*gw;
  const mf=new Intl.DateTimeFormat(LOC(),{month:'short'});
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H+B}" role="img" aria-label="${L('الدخل والمصروف خلال ستة أشهر','Inkomster och utgifter senaste sex månaderna','Income and expenses over the last six months')}"><line class="grid" x1="${L0}" x2="${W-L0}" y1="${H}" y2="${H}"/><text x="${sv()?L0:W-L0}" y="10" text-anchor="${sv()?'start':'end'}" direction="ltr">${NF(mx)}</text>`;
  data.forEach((d,i)=>{
    const x0=px(i),bw=gw*0.3,hi=d.inc/mx*(H-14),ho=d.out/mx*(H-14);
    svg+=`<rect class="bi" x="${(x0+gw*0.17).toFixed(1)}" y="${(H-hi).toFixed(1)}" width="${bw.toFixed(1)}" height="${hi.toFixed(1)}" rx="2"/><rect class="bo" x="${(x0+gw*0.53).toFixed(1)}" y="${(H-ho).toFixed(1)}" width="${bw.toFixed(1)}" height="${ho.toFixed(1)}" rx="2"/><text x="${(x0+gw/2).toFixed(1)}" y="${H+14}" text-anchor="middle">${mf.format(new Date(+d.ym.slice(0,4),+d.ym.slice(5)-1,1))}</text>`;
  });
  svg+='</svg>';
  return `<div class="panel"><h2>${L('الدخل والمصروف: آخر ستة أشهر','Inkomster och utgifter: senaste sex månaderna','Income and expenses: last six months')}</h2>${svg}<div class="hint"><i class="dot" style="background:var(--accent)"></i>${L('الدخل','Inkomst','Income')} &nbsp; <i class="dot" style="background:var(--out)"></i>${L('المصروف','Utgift','Expense')}</div></div>`;
}

function buildTips(T,P){
  const tips=[],add=(sev,ar,sw)=>tips.push({sev,txt:L(ar,sw)});
  if(!T.list.length)return tips;
  const sumC=(list,o)=>list.reduce((a,c)=>a+(o[c]||0),0);
  const needs=sumC(NEEDS,T.byCat),wants=sumC(WANTS,T.byCat);
  if(T.inc<=0)add('info','لم تسجّل دخلًا لهذا الشهر. سجّل راتبك ليظهر التحليل كاملًا.','Du har inte registrerat någon inkomst den här månaden. Lägg till din lön för en fullständig analys.');
  else{
    const r=T.net/T.inc*100;
    if(T.net<0)add('bad',`مصروفك أعلى من دخلك بمقدار ${moneyT(-T.net)}. ابدأ بتقليل الفئات المرنة مثل المطاعم والتسوق والترفيه.`,`Dina utgifter är ${moneyT(-T.net)} högre än inkomsten. Börja med att minska flexibla kategorier som restaurang, shopping och nöje.`);
    else if(r<10)add('warn',`تدّخر ${Math.round(r)}% فقط من دخلك. الهدف الشائع 20%، أي نحو ${moneyT(T.inc*0.2)} شهريًا.`,`Du sparar bara ${Math.round(r)}% av inkomsten. Ett vanligt mål är 20%, cirka ${moneyT(T.inc*0.2)} per månad.`);
    else if(r<20)add('info',`تدّخر ${Math.round(r)}% من دخلك. أنت قريب من هدف 20% (${moneyT(T.inc*0.2)}).`,`Du sparar ${Math.round(r)}% av inkomsten. Du är nära målet på 20% (${moneyT(T.inc*0.2)}).`);
    else add('good',`ممتاز: تدّخر ${Math.round(r)}% من دخلك هذا الشهر.`,`Bra jobbat: du sparar ${Math.round(r)}% av inkomsten den här månaden.`);
    if(needs/T.inc>0.5)add('warn',`الضروريات (سكن وفواتير وبقالة ومواصلات) تأخذ ${Math.round(needs/T.inc*100)}% من دخلك، والمعتاد 50% أو أقل. راجع الاشتراكات والعقود.`,`Nödvändiga utgifter (boende, räkningar, mat, transport) tar ${Math.round(needs/T.inc*100)}% av inkomsten, normalt 50% eller mindre. Se över abonnemang och avtal.`);
    if(wants/T.inc>0.3)add('warn',`الرغبات (مطاعم وتسوق وترفيه) تأخذ ${Math.round(wants/T.inc*100)}% من دخلك، والمعتاد 30% أو أقل.`,`Önskemål (restaurang, shopping, nöje) tar ${Math.round(wants/T.inc*100)}% av inkomsten, normalt 30% eller mindre.`);
  }
  OUT_CATS.forEach(c=>{
    const b=+S.settings.budgets[c]||0,v=T.byCat[c]||0;
    if(b>0&&v>b)add('bad',`تجاوزت ميزانية ${cn(c)} بمقدار ${moneyT(v-b)}.`,`Du har gått över budgeten för ${cn(c)} med ${moneyT(v-b)}.`);
    else if(b>0&&v>b*0.8)add('warn',`اقتربت من حد ميزانية ${cn(c)} (${Math.round(v/b*100)}%).`,`Du närmar dig budgetgränsen för ${cn(c)} (${Math.round(v/b*100)}%).`);
  });
  Object.entries(T.byCat).forEach(([c,v])=>{
    const p=P.byCat[c]||0;
    if(p>0&&v>p*1.3&&v>T.out*0.05)add('warn',`ارتفع صرف ${cn(c)} بنسبة ${Math.round((v/p-1)*100)}% عن الشهر السابق.`,`Utgifterna för ${cn(c)} ökade med ${Math.round((v/p-1)*100)}% jämfört med förra månaden.`);
  });
  const top=Object.entries(T.byCat).sort((a,b)=>b[1]-a[1])[0];
  if(top&&T.out>0&&top[1]/T.out>0.4&&top[0]!=='سكن')add('info',`${cn(top[0])} هي أكبر فئة وتمثل ${Math.round(top[1]/T.out*100)}% من مصروفك.`,`${cn(top[0])} är största kategorin och står för ${Math.round(top[1]/T.out*100)}% av dina utgifter.`);
  const dining=T.byCat['مطاعم']||0;
  if(T.out>0&&dining/T.out>0.15)add('info',`المطاعم والمقاهي ${Math.round(dining/T.out*100)}% من مصروفك. طهي وجبتين إضافيتين في الأسبوع قد يوفّر مبلغًا ملحوظًا.`,`Restaurang och café är ${Math.round(dining/T.out*100)}% av dina utgifter. Att laga två extra måltider i veckan kan spara en märkbar summa.`);
  const billsTotal=S.bills.reduce((a,b)=>a+b.amount,0);
  if(T.inc>0&&billsTotal/T.inc>0.4)add('warn',`الفواتير المتكررة ${Math.round(billsTotal/T.inc*100)}% من دخلك. قارن الأسعار أو ألغِ ما لا تستخدمه.`,`Återkommande räkningar är ${Math.round(billsTotal/T.inc*100)}% av inkomsten. Jämför priser eller säg upp det du inte använder.`);
  if(isCurrent(S.ym)){
    const soon=S.bills.filter(b=>!(b.paid||{})[S.ym]&&b.day-new Date().getDate()>=0&&b.day-new Date().getDate()<=7);
    if(soon.length)add('info',`لديك ${soon.length} فواتير تستحق خلال 7 أيام: ${soon.map(b=>b.name).join('، ')}.`,`Du har ${soon.length} räkningar som förfaller inom 7 dagar: ${soon.map(b=>b.name).join(', ')}.`);
    const dim=daysIn(S.ym),proj=T.out/new Date().getDate()*dim;
    if(T.inc>0&&proj>T.inc&&T.net>=0)add('warn',`بهذا المعدل سيصل مصروفك نهاية الشهر إلى نحو ${moneyT(proj)} وهو أعلى من دخلك.`,`I den här takten når utgifterna cirka ${moneyT(proj)} vid månadens slut, mer än din inkomst.`);
  }
  if(!OUT_CATS.some(c=>+S.settings.budgets[c]>0))add('info','لم تحدد ميزانية لأي فئة. افتح تبويب «الميزانية» وحدد حدًا للفئات الكبيرة.','Du har inte satt någon budget. Öppna fliken ”Budget” och sätt gränser för de största kategorierna.');
  const order={bad:0,warn:1,info:2,good:3};
  return tips.sort((a,b)=>order[a.sev]-order[b.sev]);
}

      +`<div class="hint">${L('العلامة السوداء هي الهدف. الضروريات: سكن وفواتير وبقالة ومواصلات وصحة وتعليم. الرغبات: مطاعم وتسوق وترفيه وأخرى.','Den svarta strecket är målet. Nödvändigt: boende, räkningar, mat, transport, hälsa, utbildning. Önskemål: restaurang, shopping, nöje, övrigt.','The black line is the target. Needs: housing, bills, food, transport, health, education. Wants: restaurants, shopping, entertainment, other.')}</div>`;
  }else rule=`<div class="hint">${L('سجّل دخلك لهذا الشهر لتظهر قاعدة 50/30/20.','Registrera månadens inkomst för att se 50/30/20-regeln.','Record this month\'s income to see the 50/30/20 rule.')}</div>`;

    if(rem===0)goalInfo+=`<div class="tip good"><span class="badge">${L('جيد','Bra','Good')}</span><span>${L('حققت هدفك. مبروك!','Du har nått ditt mål. Grattis!','You have reached your goal. Congratulations!')}</span></div>`;

    }
  }
  const goal=`<div class="form"><label>${L('اسم الهدف','Målets namn','Goal name')}<input data-goal="name" value="${esc(g.name||'')}" placeholder="${L('مثال: صندوق الطوارئ','t.ex. buffert','e.g. emergency fund')}"></label>
    <label>${L('المبلغ المستهدف','Målbelopp','Target amount')}<input data-goal="target" type="number" min="0" step="100" inputmode="decimal" value="${g.target||''}"></label>

  // methods

  const bt=S.bills.reduce((a,b)=>a+b.amount,0);

    [L('قاعدة 50/30/20','50/30/20-regeln','The 50/30/20 rule'),L('وزّع الدخل بعد الضرائب: 50% للضروريات، 30% للرغبات، 20% للادخار وسداد الديون.','Fördela inkomsten efter skatt: 50% till nödvändigt, 30% till önskemål, 20% till sparande och amorteringar.','Divide your after-tax income: 50% to needs, 30% to wants, 20% to savings and debt repayment.'),inc>0?L(`بدخلك هذا الشهر: ${moneyT(inc*0.5)} / ${moneyT(inc*0.3)} / ${moneyT(inc*0.2)}.`,`Med månadens inkomst: ${moneyT(inc*0.5)} / ${moneyT(inc*0.3)} / ${moneyT(inc*0.2)}.`,`With this month's income: ${moneyT(inc*0.5)} / ${moneyT(inc*0.3)} / ${moneyT(inc*0.2)}.`):''],

let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsP)return pdfjsP;
  pdfjsP=new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};
    sc.onerror=()=>{pdfjsP=null;rej(new Error('pdfjs'))};
    document.head.appendChild(sc);
  });
  return pdfjsP;
}
async function pdfToImages(file,maxPages){
  const lib=await loadPdfJs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let n=1;n<=Math.min(doc.numPages,maxPages);n++){
    const page=await doc.getPage(n),v0=page.getViewport({scale:1});
    const k=Math.min(3,1600/Math.max(v0.width,v0.height)),vp=page.getViewport({scale:k});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:cx,viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)));
  }
  return {blobs:out,pages:doc.numPages};
}

function itemsToLines(items){
  const rows=[];
  items.filter(i=>i&&i.str&&i.str.trim()).forEach(i=>{
    const x=i.transform[4],y=i.transform[5];
    let r=rows.find(r=>Math.abs(r.y-y)<=2.5);
    if(!r){r={y,its:[]};rows.push(r)}
    r.its.push({x,w:i.width||0,s:i.str});
  });
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{
    r.its.sort((a,b)=>a.x-b.x);
    let out='',prev=null;
    r.its.forEach(it=>{if(prev!==null){const gap=it.x-prev;out+=gap>12?'  ':(gap>1.2?' ':'')}out+=it.s;prev=it.x+it.w});
    return out.trim();
  }).filter(Boolean);
}
async function pdfToLines(file,maxPages){
  const lib=await loadPdfJs();

  for(let n=1;n<=Math.min(doc.numPages,maxPages||30);n++){const pg=await doc.getPage(n),tc=await pg.getTextContent();lines.push(...itemsToLines(tc.items))}

}
const AMT_RX=/[-−]?\d{1,3}(?:[  ]\d{3})*,\d{2}(?!\d)|[-−]?\d+,\d{2}(?!\d)/g;
const toNum=x=>parseFloat(String(x).replace(/−/g,'-').replace(/[  ]/g,'').replace(',','.'));
function parseStatementLines(lines){
  const hasSaldo=lines.some(l=>/saldo/i.test(l)),out=[];
  for(const raw of lines){
    const l=String(raw).replace(/ /g,' ').trim();
    if(/^(ing[åa]ende|utg[åa]ende)?\s*saldo\b/i.test(l))continue;
    const dates=l.match(/\d{4}-\d{2}-\d{2}/g);if(!dates)continue;
    const nums=l.match(AMT_RX);if(!nums)continue;
    if(hasSaldo&&nums.length<2)continue;
    const amt=toNum(hasSaldo?nums[nums.length-2]:nums[nums.length-1]);
    if(!amt)continue;
    const lastDate=l.lastIndexOf(dates[dates.length-1])+10;
    const firstNum=l.indexOf(nums[0],lastDate);
    let desc=l.slice(lastDate,firstNum>=0?firstNum:undefined).trim();
    if(!desc){const fd=l.indexOf(dates[0]);desc=l.slice(0,Math.max(fd,0)).trim()}
    desc=desc.replace(/\s{2,}/g,' ').slice(0,60);
    const inc=amt>0;
    out.push({date:dates[0],description:desc||'—',amount:Math.abs(amt),direction:inc?'in':'out',category:inc?guessCat(desc,true):guessCatSv(desc)});
  }
  return out;
}
function splitCsv(line,d){
  const o=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}
    else if(c===d&&!q){o.push(cur);cur=''}else cur+=c}
  o.push(cur);return o;
}
function normDate(s){

  m=s.match(/^(\d{2})[-\/.](\d{2})[-\/.](\d{4})/);if(m)return m[3]+'-'+m[2]+'-'+m[1];
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);if(m)return m[1]+'-'+m[2]+'-'+m[3];

function csvNum(x){

function parseCsvTx(text){
  const lines=String(text).replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return [];
  const dateP=[/^bokf[öo]ringsdag/,/^bokf[öo]ringsdatum/,/^reskontradatum/,/^transaktionsdag/,/^transaktionsdatum/,/^datum/,/^date/,/^valutadag/];
  const textP=[/^beskrivning/,/^text$/,/^namn/,/^rubrik/,/^mottagare/,/^referens/,/^description/,/^transaktion$/];
  const amtP=[/^belopp/,/^summa/,/^amount/];
  for(let h=0;h<Math.min(8,lines.length-1);h++){
    for(const d of [';','\t',',']){
      const cols=splitCsv(lines[h],d).map(c=>c.trim().toLowerCase());
      if(cols.length<3)continue;
      const find=P=>{for(const r of P){const i=cols.findIndex(c=>r.test(c));if(i>=0)return i}return -1};
      const di=find(dateP),ai=find(amtP),ti=find(textP);
      if(di<0||ai<0)continue;
      const altT=cols.findIndex((c,i)=>i!==ti&&/^(rubrik|text|beskrivning)/.test(c));
      const out=[];
      for(let r=h+1;r<lines.length;r++){
        const c=splitCsv(lines[r],d);if(c.length<=Math.max(di,ai))continue;
        const date=normDate(c[di]),amt=csvNum(c[ai]);
        if(!date||!(Math.abs(amt)>0))continue;
        let desc=((ti>=0?c[ti]:'')||'').trim();
        if(!desc&&altT>=0)desc=(c[altT]||'').trim();
        desc=desc.replace(/\s{2,}/g,' ').slice(0,60)||'—';
        const inc=amt>0;
        out.push({date,description:desc,amount:Math.abs(amt),direction:inc?'in':'out',category:inc?guessCat(desc,true):guessCatSv(desc)});
      }
      if(out.length)return out;
    }
  }

}

function parseTextTx(text){
  const out=[],lines=String(text).split(/\r?\n/).map(x=>x.replace(/\u00a0/g,' ').trim()).filter(Boolean);
  const dirDefault=/avsändare|insättning|inbetalning/i.test(lines.slice(0,8).join(' '))?'in':'out';
  const AMT=/^[-−+]?\d{1,3}(?: ?\d{3})*(?:[.,]\d{1,2})?$|^[-−+]?\d+(?:[.,]\d{1,2})?$/,DATE=/^\d{4}-\d{2}-\d{2}$/;
  const push=(date,desc,a)=>{
    const neg=/^[-−]/.test(a),pos=/^\+/.test(a),amt=Math.abs(numOf(a.replace(/[−+]/g,m=>m==='−'?'-':'')));

  };
  for(let i=0;i<lines.length;i++){

    }
  }
  return out;
}

const numOf=x=>{if(typeof x==='number')return x;const n=parseFloat(String(x).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
async function saveItems(list,fileName){
  if(!list.length)return {n:0,inc:0,out:0};
  if(!list.some(x=>(x.date||'').startsWith(S.ym))){const ds=list.map(x=>x.date).filter(Boolean).sort();if(ds.length)S.ym=ds[ds.length-1].slice(0,7)}
  let inc=0,out=0;const ids=[];
  for(const x of list){
    x.txId=await saveTx({type:x.type,amount:x.amount,category:x.category,note:x.desc,date:x.date,method:'',img:x.img||'',createdAt:Date.now()});
    x.saved=true;x.sel=false;ids.push(x.txId);
    if(x.type==='in')inc+=x.amount;else out+=x.amount;
  }
  const log=(S.settings.imports||[]).concat([{file:fileName,date:todayStr(),n:list.length,inc,out,ids}]).slice(-50);
  S.settings.imports=log;
  try{await saveSettings()}catch(_){}
  const last=list.map(x=>x.date).sort().pop();if(last)S.ym=last.slice(0,7);
  return {n:list.length,inc,out};
}
async function runImport(){

}

/* ---------- actions ---------- */
function normDigits(s){return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/٬|،/g,'').replace(/(\d),(\d)/g,'$1.$2')}
function guessCat(text,inc){
  if(inc)return /راتب|lön|salary|wage/i.test(text)?'راتب':/حر|مشروع|عمل|frilans|uppdrag/i.test(text)?'عمل حر':/هدية|gåva/i.test(text)?'هدية':'أخرى';
  for(const c of OUT_CATS)if((KEYS[c]&&KEYS[c].test(text))||(EN_KEYS[c]&&EN_KEYS[c].test(text)))return c;
  return 'أخرى';
}
function parseQuick(q){
  const n=normDigits(q);const m=n.match(/(\d+(?:\.\d+)?)/);
  if(!m)return null;
  const inc=/(راتب|استلمت|قبضت|إيراد|ايراد|دخل|وصلني|وصلتني|lön|fick|inkomst|insättning|salary|wage|earned|received|income|deposit|got paid)/i.test(n);
  const note=n.replace(m[0],'').replace(/(^|\s)(صرفت|دفعت|اشتريت|استلمت|قبضت|على|في|مبلغ|betalade|köpte|fick|på|för|kr|sek|paid|spent|bought|got|received|earned|on|for)(?=\s|$)/gi,' ').replace(/\s+/g,' ').trim();
  return {type:inc?'in':'out',amount:parseFloat(m[1]),category:guessCat(n,inc),note};
}
async function addTx(o){
  const date=o.date||todayStr();
  await saveTx({type:o.type,amount:o.amount,category:o.category,note:o.note||'',date,method:o.method||'',img:o.img||'',createdAt:Date.now()});
  const d=new Date(date+'T12:00:00');
  if(ymOf(d)!==S.ym)S.ym=ymOf(d);
  render();
}
function budgetNote(cat){
  const b=+S.settings.budgets[cat]||0;if(!b)return '';
  const s=totals(S.ym).byCat[cat]||0;
  return s>b?L(` · تجاوزت ميزانية ${cn(cat)}`,` · Över budget för ${cn(cat)}`,` · Over budget for ${cn(cat)}`):L(` · المتبقي في ${cn(cat)}: ${moneyT(b-s)}`,` · Kvar i ${cn(cat)}: ${moneyT(b-s)}`,` · Left in ${cn(cat)}: ${moneyT(b-s)}`);
}

const view=$('#view');

      const b=S.bills.find(x=>x.id===b0.dataset.pay);if(!b)return;
      const paid=(b.paid||{})[S.ym],txId='bill_'+b.id+'_'+S.ym;

      if(!paid)await saveTx({type:'out',amount:b.amount,category:b.category,note:b.name,date,method:'',img:b.img||'',createdAt:Date.now()},txId);
      else if(S.mode==='cloud')await S.refs.tx.doc(txId).delete(); else S.tx=S.tx.filter(x=>x.id!==txId);
      await saveBill({...b,paid:{...(b.paid||{}),[S.ym]:!paid}},b.id);

    else if(b0.id==='addAllRec'){const all=recurring();for(const r of all)await saveBill({name:r.name,amount:r.amount,day:r.day,category:r.cat,paid:{},img:''});toast(L(`أُضيفت ${all.length} فاتورة`,`${all.length} räkningar lades till`,`${all.length} bills were added`));render()}
    else if(b0.id==='autoBud'){const {avg,n}=avgByCat();let k=0;for(const c of OUT_CATS){if(!(+S.settings.budgets[c]>0)&&avg[c]>0){S.settings.budgets[c]=Math.ceil(avg[c]*1.05/10)*10;k++}}
      if(!k){toast(L('لا توجد بيانات كافية أو الميزانيات محددة','Inte tillräckligt med data eller budgeten är redan satt','Not enough data, or the budget is already set'))}else{try{await saveSettings()}catch(_){}toast(L(`ملأتُ ${k} فئات من متوسط ${n} شهر`,`Fyllde ${k} kategorier från snittet av ${n} mån`,`Filled ${k} categories from the ${n}-month average`));render()}}
    else if(b0.id==='askBtn')await askClaude();
    else if(b0.id==='impRun')await runImport();
    else if(b0.id==='impAdd')await addImported();

const CATS_ALL=[...new Set([...OUT_CATS,...IN_CATS])];
function readPrompt(){
  const cats=CATS_ALL.map(c=>`${c} (${CAT_SV[c]})`).join(', ');
  if(sv())return `Du läser en bild av en faktura, ett kvitto, ett kontoutdrag eller ett finansiellt meddelande (oftast på svenska, ibland engelska). Svara ENDAST med JSON i detta format:
{"type":"out" eller "in","amount":totalbelopp att betala eller ta emot som tal, eller null om bilden är ett kontoutdrag med flera poster,"currency":"SEK" t.ex.,"date":"YYYY-MM-DD" för transaktionen eller förfallodagen, eller null,"merchant":avsändare eller butik,"category":exakt ett av följande värden (skriv det arabiska värdet före parentesen exakt som det är): ${cats},"summary":en eller två meningar på enkel svenska om vad användaren ska göra och eventuell sista betalningsdag,"translation":en tydlig förklaring på enkel svenska av all viktig text i bilden; för kontoutdrag, förklara varje post med datum och belopp på en egen rad; behåll siffror, datum och OCR-/kontonummer exakt}
Gissa aldrig siffror som inte syns. Använd null i stället för att gissa.`;
  return `أنت تقرأ صورة فاتورة أو إيصال أو كشف حساب أو رسالة مالية باللغة السويدية (وقد تكون بالإنجليزية). أعد JSON فقط بهذا الشكل:
{"type":"out" أو "in","amount":رقم الإجمالي المطلوب دفعه أو المستلم، أو null إن كانت الصورة كشف حساب فيه عدة بنود,"currency":"SEK" مثلا,"date":"YYYY-MM-DD" تاريخ العملية أو الاستحقاق، أو null,"merchant":اسم الجهة أو المتجر,"category":قيمة واحدة فقط من التالي (اكتب القيمة العربية التي قبل القوس كما هي): ${cats},"summary":ملخص بالعربية في جملة أو جملتين يذكر ما المطلوب من المستخدم وأي موعد نهائي,"translation":ترجمة عربية واضحة لكل النص المهم في الصورة، وللكشف الحسابي ترجم كل بند مع تاريخه ومبلغه في سطر منفصل، وأبقِ الأرقام والتواريخ وأرقام OCR/الحساب كما هي}
لا تخمّن أرقامًا غير ظاهرة. استخدم null بدل التخمين.`;
}
function readErr(e){if(e&&e.code==='images_unavailable')return L('قراءة الصور غير متاحة في هذه النسخة. استخدم ملف PDF نصيًا أو CSV أو TXT، أو أضف العملية يدويًا.','Bildläsning finns inte i den här versionen. Använd en textbaserad PDF, CSV eller TXT, eller lägg till manuellt.','Image reading is not available in this version. Use a text-based PDF, CSV or TXT file, or add the entry manually.');if(e&&e.code==='image_rejected')return L('الصورة غير مقبولة (نوعها أو حجمها). جرّب JPG أو PNG أصغر.','Bilden godtogs inte (typ eller storlek). Prova en mindre JPG eller PNG.','The image was not accepted (type or size). Try a smaller JPG or PNG.');if(e&&e.code==='invalid_key')return L('مفتاح API غير صالح أو منتهٍ.','API-nyckeln är ogiltig eller har gått ut.','The API key is invalid or has expired.');if(e&&e.code==='network')return L('تعذّر الاتصال بالإنترنت.','Ingen anslutning till internet.','No internet connection.');return e&&e.code==='not_granted'?L('قراءة الصور غير متاحة في هذه النسخة. استخدم ملف PDF نصيًا أو CSV أو TXT، أو أضف العملية يدويًا.','Bildläsning finns inte i den här versionen. Använd en textbaserad PDF, CSV eller TXT, eller lägg till manuellt.','Image reading is not available in this version. Use a text-based PDF, CSV or TXT file, or add the entry manually.'):e&&e.code==='rate_limited'?L('طلبات كثيرة، انتظر قليلًا ثم أعد المحاولة.','För många förfrågningar. Vänta en stund och försök igen.','Too many requests. Wait a moment and try again.'):L('تعذّرت قراءة الصورة. جرّب صورة أوضح.','Det gick inte att läsa bilden. Prova en tydligare bild.','Could not read the image. Try a clearer image.')}
function showRead(box,r){
  box.hidden=false;
  box.textContent=[r.merchant&&(L('الجهة: ','Avsändare: ','Sender: ')+r.merchant),r.amount!=null&&(L('المبلغ: ','Belopp: ','Amount: ')+NF(r.amount)+' '+(r.currency||'')),r.date&&(L('التاريخ: ','Datum: ','Date: ')+r.date),'',r.summary,'',r.translation].filter(x=>x!==null&&x!==undefined&&x!==false).join('\n').trim();
}

const med=a=>{const x=[...a].sort((p,q)=>p-q),n=x.length;return n?(n%2?x[(n-1)/2]:(x[n/2-1]+x[n/2])/2):0};
const REC_RX=/försäkr|tele2|telia|\btre\b|hi3g|comviq|e\.on|vattenfall|kommun|renh|verisure|a-kassa|akademikern|hyra|abonnemang|bredband|netflix|spotify|viaplay|sportlife|csn|bmw fin|vatten|gym|träning/i;
const SKIP_RX=/överf|overf|swish|intern/i;
function normM(s){
  const t=String(s||'').toLowerCase().replace(/e\.on/g,'eon').replace(/[0-9#*.,:;()\/\\_+&-]+/g,' ');
  const w=t.split(/\s+/).filter(x=>x.length>1&&!/^(ab|sverige|sweden|bank|finans|kundservice|kundsupport|financial|services|kort|privat)$/.test(x));
  if(!w.length)return '';
  return w[0].length<4&&w[1]?w[0]+' '+w[1]:w[0];
}
const sameM=(a,b)=>a&&b&&(a===b||(a.length>3&&b.length>3&&(a.includes(b)||b.includes(a))));
function findPay(key,amount,ym){
  if(!key)return null;
  return S.tx.find(x=>x.type==='out'&&!x.dup&&x.date&&x.date.startsWith(ym)&&sameM(normM(x.note||''),key)&&Math.abs(x.amount-amount)<=Math.max(amount*0.15,5))||null;
}
function monthsBack(ym,n){const o=[];let y=+ym.slice(0,4),m=+ym.slice(5);for(let i=0;i<n;i++){o.push(y+'-'+pad(m));m--;if(m===0){m=12;y--}}return o}
function recurring(){
  const groups={};
  S.tx.forEach(x=>{if(x.type!=='out'||!x.date||x.dup||SKIP_RX.test(x.note||''))return;const k=normM(x.note||'');if(!k||k.length<3)return;(groups[k]=groups[k]||[]).push(x)});
  const res=[];
  for(const [k,list] of Object.entries(groups)){
    const sorted=list.slice().sort((a,b)=>a.amount-b.amount),clusters=[];
    sorted.forEach(x=>{const c=clusters[clusters.length-1];if(c&&x.amount<=c[c.length-1].amount*1.15+0.5)c.push(x);else clusters.push([x])});
    clusters.forEach(c=>{
      const months=new Set(c.map(x=>x.date.slice(0,7))),known=REC_RX.test(c[0].note||'');
      if(months.size<2&&!known)return;
      if(c.length/months.size>1.3)return;
      const amount=Math.round(med(c.map(x=>x.amount))*100)/100;
      if(S.bills.some(b=>sameM(normM(b.name),k)&&Math.abs(b.amount-amount)<=Math.max(amount*0.2,5)))return;
      const latest=c.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
      const cats={};c.forEach(x=>cats[x.category]=(cats[x.category]||0)+1);
      let cat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0][0];
      if(cat==='أخرى'||!OUT_CATS.includes(cat))cat=known?'فواتير':'أخرى';
      res.push({id:k+'|'+Math.round(amount),key:k,name:String(latest.note||k).slice(0,40),amount,day:Math.max(1,Math.min(31,Math.round(med(c.map(x=>+x.date.slice(8)))))),cat,months:months.size,known});
    });
  }
  return res.sort((a,b)=>a.day-b.day);
}
function recPanel(){
  const det=recurring();if(!det.length)return '';
  const rows=det.map(r=>`<div class="row" style="grid-template-columns:1fr auto auto"><div class="t"><b>${esc(r.name)}</b><span>${esc(cn(r.cat))} · ${L(`يوم ${r.day} تقريبًا`,`ca den ${r.day}:e`,`about day ${r.day}`)} · <span class="chip">${r.months>1?L(`${r.months} أشهر`,`${r.months} mån`,`${r.months} mo`):L('جهة معروفة','känt namn','known name')}</span></span></div><div class="amt">${money(r.amount)}</div><div class="acts"><button class="btn small primary" data-addrec="${esc(r.id)}">${L('أضف','Lägg till','Add')}</button></div></div>`).join('');
  return `<div class="panel"><h2>${L(`اكتشفت ${det.length} فاتورة متكررة من عملياتك`,`Hittade ${det.length} återkommande betalningar i dina poster`,`Found ${det.length} recurring payments in your entries`)}</h2><div class="hint">${L('تُكتشف من الجهات التي تتكرر بمبلغ متقارب كل شهر. بعد إضافتها تُعلَّم «مدفوعة» تلقائيًا عندما تجد دفعتها في عملياتك، وتظهر في التوقعات.','Hittas bland betalningar som återkommer med liknande belopp varje månad. När de lagts till markeras de som betalda automatiskt när betalningen finns bland dina poster, och de visas i prognosen.','Found among payments that recur with a similar amount every month. Once added they are marked as paid automatically when the payment appears among your entries, and they show up in the forecast.')}</div><div class="list">${rows}</div><div><button class="btn primary" id="addAllRec">${L('أضف الكل إلى الفواتير','Lägg till alla som räkningar','Add all as bills')}</button></div></div>`;
}
function avgByCat(){
  let ms=monthsBack(prevYm(S.ym),3).filter(ym=>monthTx(ym).length);
  if(!ms.length)ms=monthTx(S.ym).length?[S.ym]:[];
  const o={};ms.forEach(ym=>{const T=totals(ym);for(const [c,v] of Object.entries(T.byCat))o[c]=(o[c]||0)+v});
  for(const c in o)o[c]/=Math.max(ms.length,1);
  return {avg:o,n:ms.length};
}
function expectedItems(ym){
  const dim=daysIn(ym),items=[];
  S.bills.forEach(b=>{const k=normM(b.name);items.push({name:b.name,amount:b.amount,day:Math.min(b.day,dim),paid:!!(b.paid||{})[ym]||!!findPay(k,b.amount,ym),key:k,src:'bill'})});
  recurring().forEach(r=>items.push({name:r.name,amount:r.amount,day:Math.min(r.day,dim),paid:!!findPay(r.key,r.amount,ym),key:r.key,src:'auto'}));
  return items.sort((a,b)=>a.day-b.day);
}
function isFixed(x,items){const k=normM(x.note||'');return SKIP_RX.test(x.note||'')||items.some(i=>sameM(i.key,k))}

/* EV charging */
function evStats(){
  const E=XX().ev,ss=S.ev.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.odo||0)-(b.odo||0));
  const kwh=ss.reduce((a,s)=>a+s.kwh,0),cost=ss.reduce((a,s)=>a+s.cost,0),price=kwh>0?cost/kwh:0;
  let per100=0,km=0;
  const idx=ss.map((s,i)=>s.odo>0?i:-1).filter(i=>i>=0);
  if(idx.length>=2){const a=idx[0],b=idx[idx.length-1];km=ss[b].odo-ss[a].odo;let used=0;for(let i=a+1;i<=b;i++)used+=ss[i].kwh;if(km>0)per100=used/km*100}
  const measured=per100>0;if(!(per100>0)&&+E.evL>0)per100=+E.evL;

  const kmMonth=km>0&&idx.length>=2?km/Math.max(1,(new Date(ss[idx[idx.length-1]].date)-new Date(ss[idx[0]].date))/(30.4*864e5)):0;

}

function evParseText(t){
  const n=x=>parseFloat(String(x).replace(/\s/g,'').replace(',','.'));
  const r={};
  const ks=[...t.matchAll(/(\d+(?:[.,]\d+)?)\s*kWh/gi)].map(m=>n(m[1])).filter(x=>x>0);
  if(ks.length)r.kwh=Math.max(...ks);
  const m=t.match(/(?:att betala|totalt belopp|totalt|summa|total|belopp)[^\d\n]{0,25}(\d[\d\s]*(?:[.,]\d{1,2})?)/i);
  if(m)r.total=n(m[1]);
  const d=t.match(/(20\d{2}-\d{2}-\d{2})/);if(d)r.date=d[1];
  return r;
}

  try{

    else if(isPdf(f)){try{text=(await pdfToLines(f,6)).join('\n')}catch(_){}}

/* ---------- v28: radar (duplicates, frequency, price changes, outlook, no-spend days) ---------- */
function dupGroups(){
  const out=S.tx.filter(x=>x.type==='out'&&x.date&&!x.dup&&!x.nodup&&!SKIP_RX.test(x.note||'')).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const res=[],used=new Set();
  for(let i=0;i<out.length;i++){
    if(used.has(out[i].id))continue;const a=out[i],ka=normM(a.note||'');
    for(let j=i+1;j<out.length;j++){
      const b=out[j];if(used.has(b.id))continue;
      const gap=(new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/864e5;if(gap>1)break;if(gap===1&&a.amount<100)continue;
      if(Math.abs(a.amount-b.amount)<0.01&&a.amount>=20&&normM(b.note||'')===ka&&(ka||a.category===b.category)){used.add(a.id);used.add(b.id);res.push([a,b]);break}
    }
  }
  return res.reverse();
}
function freqMerchants(){
  const ym=S.ym,prev=monthsBack(prevYm(ym),3),cur={},hist={};
  monthTx(ym).forEach(x=>{if(x.type!=='out'||SKIP_RX.test(x.note||''))return;const k=normM(x.note||'');if(k.length<3)return;const o=cur[k]||(cur[k]={name:x.note,n:0,sum:0});o.n++;o.sum+=x.amount});
  prev.forEach(m=>monthTx(m).forEach(x=>{if(x.type!=='out')return;const k=normM(x.note||'');if(k.length<3)return;hist[k]=(hist[k]||0)+1}));
  const nm=prev.filter(m=>monthTx(m).length).length||1;
  return Object.entries(cur).map(([k,o])=>({...o,k,avg:(hist[k]||0)/nm})).filter(o=>o.n>=4&&(o.avg===0?o.n>=5:o.n>=o.avg*1.5)).sort((a,b)=>b.n-a.n).slice(0,6);
}
function priceChanges(){
  const g={};S.tx.forEach(x=>{if(x.type!=='out'||x.dup||!x.date||SKIP_RX.test(x.note||''))return;const k=normM(x.note||'');if(k.length<3)return;(g[k]=g[k]||[]).push(x)});
  const res=[];
  for(const [k,l] of Object.entries(g)){
    const ms=new Set(l.map(x=>x.date.slice(0,7)));if(ms.size<3||l.length/ms.size>1.3)continue;
    const s2=l.slice().sort((a,b)=>a.date.localeCompare(b.date)),last=s2[s2.length-1];
    let i=s2.length-2;while(i>=0&&Math.abs(s2[i].amount-last.amount)/last.amount<0.04)i--;
    const prev=s2[i];if(!prev)continue;
    const d=Math.abs(last.amount-prev.amount);if(d<5||d/prev.amount<0.04||d/prev.amount>0.6)continue;
    res.push({name:last.note||k,from:prev.amount,to:last.amount,date:last.date});
  }
  return res.sort((a,b)=>(b.to-b.from)-(a.to-a.from)).slice(0,6);
}
function outlook(){
  const ms=monthsBack(prevYm(ymOf(new Date())),3).filter(m=>monthTx(m).length);if(!ms.length)return null;
  let inc=0,out=0,ci=0;ms.forEach(m=>{const T=totals(m);if(T.inc>0){inc+=T.inc;ci++}out+=T.out});
  inc=ci?inc/ci:0;out/=ms.length;
  const rec=expectedItems(ymOf(new Date())).reduce((a,i)=>a+i.amount,0);
  const o=Math.max(out,rec);const arr=[];let cum=0;
  let y=new Date().getFullYear(),m=new Date().getMonth()+1;
  for(let i=1;i<=3;i++){m++;if(m>12){m=1;y++}cum+=inc-o;arr.push({ym:y+'-'+pad(m),inc,out:o,net:inc-o,cum})}
  return arr;
}

function yearAgo(ym){return (+ym.slice(0,4)-1)+'-'+ym.slice(5)}
function topCats(T,n){return Object.entries(T.byCat).sort((a,b)=>b[1]-a[1]).slice(0,n)}

  const dim=daysIn(S.ym),spent=new Set(monthTx(S.ym).filter(x=>x.type==='out').map(x=>+x.date.slice(8)));let free=0;const upto=isCurrent(S.ym)?new Date().getDate():dim;for(let d=1;d<=upto;d++)if(!spent.has(d))free++;

    <label>${L('الأشخاص الآخرون (مفصولون بفاصلة)','Övriga personer (kommaseparerade)','Other people (comma-separated)')}<input id="spOthers" required placeholder="Ali, Sara"></label>
    <label>${L('من دفع؟ (اتركه فارغًا إن كنت أنت)','Vem betalade? (tomt = jag)','Who paid? (empty = me)')}<input id="spPayer"></label>
    <div class="wide hint">${L('يُقسَّم المبلغ بالتساوي بينك وبين الأشخاص المذكورين.','Beloppet delas lika mellan dig och de angivna personerna.','The amount is split equally between you and the people listed.')}</div>
    <div class="wide"><button class="btn primary" type="submit">${L('إضافة تقسيم','Lägg till delning','Add split')}</button></div></form></div>`;
}

function viewForecast(v){
  const ym=S.ym,dim=daysIn(ym),T=totals(ym),nowYm=ymOf(new Date());
  if(!S.tx.length&&!S.bills.length){v.innerHTML=`<div class="panel"><div class="empty"><b>${L('لا توجد بيانات للتوقع','Ingen data för prognos','No data for a forecast')}</b><span>${L('استورد كشف حسابك أو سجّل بعض العمليات والفواتير ليحسب التطبيق توقعاتك.','Importera ditt kontoutdrag eller registrera poster och räkningar så räknar appen ut din prognos.','Import your statement or record entries and bills and the app will work out your forecast.')}</span></div></div>`;return}
  const today=ym<nowYm?dim+1:(ym>nowYm?0:new Date().getDate());
  const items=expectedItems(ym),upcoming=items.filter(i=>!i.paid&&(today===0||i.day>=today||i.src==='bill')&&today<=dim);
  // variable spending
  const fixedKeys=items;
  const varSpent=T.list.filter(x=>x.type==='out'&&!isFixed(x,fixedKeys)).reduce((a,x)=>a+x.amount,0);
  const hist=monthsBack(prevYm(ym),3).filter(m=>monthTx(m).length);
  const histVar=hist.map(m=>monthTx(m).filter(x=>x.type==='out'&&!isFixed(x,fixedKeys)).reduce((a,x)=>a+x.amount,0));
  const histVarDay=histVar.length?histVar.reduce((a,b)=>a+b,0)/histVar.length/dim:0;
  const elapsed=Math.max(1,Math.min(today,dim));
  const varDay=today>dim?0:(today>=7||!histVarDay?varSpent/elapsed:(varSpent/elapsed*0.4+histVarDay*0.6));
  // expected salary
  const salMonths=monthsBack(prevYm(ym),4).map(m=>monthTx(m).filter(x=>x.type==='in'&&x.category==='راتب'));
  const salSums=salMonths.filter(l=>l.length).map(l=>l.reduce((a,x)=>a+x.amount,0));
  const salDays=salMonths.flat().map(x=>+x.date.slice(8));
  const gotSalary=T.list.some(x=>x.type==='in'&&x.category==='راتب');
  const sal=(!gotSalary&&salSums.length&&today<=dim)?{amount:med(salSums),day:Math.min(Math.round(med(salDays))||25,dim)}:null;
  const salaryAhead=sal&&(today===0||sal.day>=today);
  // series
  const net=Array(dim+1).fill(0);
  for(let d=1;d<=dim;d++){const dd=ym+'-'+pad(d);net[d]=net[d-1]+T.list.filter(x=>x.date===dd).reduce((a,x)=>a+(x.type==='in'?x.amount:-x.amount),0)}
  const actual=[];for(let d=1;d<=Math.min(Math.max(today,0),dim);d++)actual.push([d,net[d]]);
  const proj=[];let bal=today>=1?net[Math.min(today,dim)]:0;
  if(today<=dim){
    if(today>=1)proj.push([today,bal]);
    for(let d=Math.max(today+1,1);d<=dim;d++){
      bal-=varDay;
      upcoming.forEach(i=>{if(i.day===d||(i.day<d&&i.day<today&&d===Math.max(today+1,1)))bal-=i.amount});
      if(salaryAhead&&sal.day===d)bal+=sal.amount;
      proj.push([d,bal]);
    }
  }
  const endNet=today>dim?T.net:(proj.length?proj[proj.length-1][1]:T.net);
  const upTotal=upcoming.reduce((a,i)=>a+i.amount,0);
  // chart
  const W=640,H=170,B=22,P=10,all=[...actual,...proj].map(p=>p[1]).concat([0]);
  const mn=Math.min(...all),mx=Math.max(...all),rng=(mx-mn)||1;
  const X=d=>{const x=P+(d-1)*(W-2*P)/Math.max(dim-1,1);return sv()?x:W-x},Y=val=>H-4-(val-mn)/rng*(H-24);
  const pth=a=>a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  let svg=`<svg class="fc" viewBox="0 0 ${W} ${H+B}" role="img" aria-label="${L('توقع صافي الشهر','Prognos för månadens netto','Forecast for the month\'s net')}"><line class="z" x1="${P}" x2="${W-P}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>`;
  if(proj.length>1)svg+=`<path class="p" d="${pth(proj)}"/>`;
  if(actual.length>1)svg+=`<path class="a" d="${pth(actual)}"/>`;
  if(actual.length)svg+=`<circle class="dotn" cx="${X(actual[actual.length-1][0]).toFixed(1)}" cy="${Y(actual[actual.length-1][1]).toFixed(1)}" r="5"/>`;
  [1,8,15,22,dim].forEach(d=>{svg+=`<text x="${X(d).toFixed(1)}" y="${H+14}" text-anchor="middle">${d}</text>`});
  svg+=`<text x="${sv()?P:W-P}" y="10" text-anchor="${sv()?'start':'end'}" direction="ltr">${NF(Math.round(mx))}</text><text x="${sv()?P:W-P}" y="${H-8}" text-anchor="${sv()?'start':'end'}" direction="ltr">${NF(Math.round(mn))}</text></svg>`;
  // next month
  const hm=monthsBack(ym,3).slice(1).filter(m=>monthTx(m).length||m===ym);
  const histMonths=monthsBack(prevYm(ym),3).filter(m=>monthTx(m).length);
  const incAvg=histMonths.length?histMonths.reduce((a,m)=>a+totals(m).inc,0)/histMonths.length:T.inc;
  const recTotal=items.reduce((a,i)=>a+i.amount,0),varMonth=varDay*dim||histVarDay*dim;
  const outNext=recTotal+(histVar.length?histVar.reduce((a,b)=>a+b,0)/histVar.length:varSpent/elapsed*dim),saveNext=incAvg-outNext;
  const g=S.settings.goal,rem=g&&g.target>0?Math.max(0,g.target-(g.saved||0)):0;
  const goalLine=rem>0?`<div class="tip info"><span class="badge">${L('هدف','Mål','Goal')}</span><span>${saveNext>0?L(`بهذا المعدل (${moneyT(saveNext)} شهريًا) تصل إلى هدف «${esc(g.name||'')}» خلال ${Math.ceil(rem/saveNext)} شهرًا.`,`Med den här takten (${moneyT(saveNext)} per månad) når du målet ”${esc(g.name||'')}” om ${Math.ceil(rem/saveNext)} månader.`,`At this pace (${moneyT(saveNext)} per month) you reach the goal “${esc(g.name||'')}” in ${Math.ceil(rem/saveNext)} months.`):L('لا يوجد ادخار متوقع الشهر القادم، فلن يتقدم الهدف.','Inget sparande väntas nästa månad, så målet står still.','No saving is expected next month, so the goal stands still.')}</span></div>`:'';
  const tips=[];
  if(today<=dim){
    if(endNet<0)tips.push(['bad',L(`المتوقع أن ينتهي الشهر بعجز ${moneyT(-endNet)}. قلّل المصروف المتغير أو أجّل دفعة غير ضرورية.`,`Månaden väntas sluta med underskott på ${moneyT(-endNet)}. Minska rörliga utgifter eller skjut upp en onödig betalning.`,`The month is expected to end with a deficit of ${moneyT(-endNet)}. Reduce variable spending or postpone an unnecessary payment.`)]);
    else if(T.inc>0||sal)tips.push(['good',L(`المتوقع أن ينتهي الشهر بفائض ${moneyT(endNet)} إن استمر صرفك بالمعدل الحالي.`,`Månaden väntas sluta med ett överskott på ${moneyT(endNet)} om du fortsätter i nuvarande takt.`,`The month is expected to end with a surplus of ${moneyT(endNet)} if you continue at the current pace.`)]);
    if(varDay>0)tips.push(['info',L(`صرفك المتغير (بدون الفواتير الثابتة) نحو ${moneyT(varDay)} يوميًا.`,`Dina rörliga utgifter (utan fasta räkningar) är cirka ${moneyT(varDay)} per dag.`,`Your variable spending (excluding fixed bills) is about ${moneyT(varDay)} per day.`)]);
  }
  const badge={good:L('جيد','Bra','Good'),bad:L('مهم','Viktigt','Important'),warn:L('انتبه','Obs','Note'),info:L('معلومة','Info','Info')};
  const upRows=upcoming.length?'<div class="list">'+upcoming.map(i=>`<div class="row" style="grid-template-columns:auto 1fr auto"><span class="chip ${i.day<today?'late':(i.day-today<=3?'soon':'')}">${L(`يوم ${i.day}`,`den ${i.day}:e`,`day ${i.day}`)}</span><div class="t"><b>${esc(i.name)}</b><span>${i.src==='bill'?L('فاتورة مسجّلة','Registrerad räkning','Registered bill'):L('متوقعة من عملياتك السابقة','Väntad utifrån dina tidigare poster','Expected from your earlier entries')}</span></div><div class="amt outc">${money(i.amount)}</div></div>`).join('')+'</div>'
    :`<div class="hint">${today>dim?L('انتهى هذا الشهر.','Den här månaden är slut.','This month is over.'):L('لا توجد فواتير غير مدفوعة متوقعة هذا الشهر.','Inga obetalda räkningar väntas den här månaden.','No unpaid bills are expected this month.')}</div>`;
  v.innerHTML=`<div class="panel"><h2>${L('توقع نهاية الشهر','Prognos för månadens slut','Forecast for the end of the month')}</h2>
    <div class="kpis"><div class="kpi ${endNet<0?'bad':'good'}"><div class="k">${L('الصافي المتوقع آخر الشهر','Väntat netto vid månadens slut','Expected net at the end of the month')}</div><div class="v">${money(endNet)}</div></div>
    <div class="kpi"><div class="k">${L('فواتير قادمة','Kommande räkningar','Upcoming bills')}</div><div class="v">${money(upTotal)}</div></div>
    <div class="kpi"><div class="k">${L('صرف متغير يوميًا','Rörlig utgift per dag','Variable spending per day')}</div><div class="v">${money(varDay)}</div></div>
    ${salaryAhead?`<div class="kpi"><div class="k">${L(`راتب متوقع يوم ${sal.day}`,`Väntad lön den ${sal.day}:e`,`Expected salary on day ${sal.day}`)}</div><div class="v">${money(sal.amount)}</div></div>`:''}</div>
    ${svg}<div class="legend2"><span><i></i>${L('الفعلي','Faktiskt','Actual')}</span><span><i class="p"></i>${L('المتوقع','Prognos','Forecast')}</span></div>
    ${tips.length?'<div class="tips">'+tips.map(([sv_,t])=>`<div class="tip ${sv_}"><span class="badge">${badge[sv_]}</span><span>${t}</span></div>`).join('')+'</div>':''}</div>
    <div class="panel"><h2>${L('الدفعات القادمة','Kommande betalningar','Upcoming payments')}</h2>${upRows}</div>
    <div class="panel"><h2>${L('تقدير الشهر القادم','Uppskattning nästa månad','Estimate for next month')}</h2>${histMonths.length||T.list.length?`<div class="kpis"><div class="kpi"><div class="k">${L('دخل متوقع','Väntad inkomst','Expected income')}</div><div class="v">${money(incAvg)}</div></div><div class="kpi"><div class="k">${L('مصروف متوقع','Väntade utgifter','Expected expenses')}</div><div class="v">${money(outNext)}</div></div><div class="kpi ${saveNext<0?'bad':'good'}"><div class="k">${L('ادخار متوقع','Väntat sparande','Expected saving')}</div><div class="v">${money(saveNext)}</div></div></div><div class="hint">${L('المصروف = الفواتير الثابتة المعروفة + متوسط صرفك المتغير في الأشهر السابقة. الدخل = متوسط آخر ثلاثة أشهر.','Utgifter = kända fasta räkningar + ditt genomsnitt av rörliga utgifter tidigare månader. Inkomst = snittet av de senaste tre månaderna.','Expenses = known fixed bills + your average variable spending in earlier months. Income = the average of the last three months.')}</div>${goalLine}`:`<div class="hint">${L('تحتاج إلى عمليات من شهر واحد على الأقل.','Du behöver poster från minst en månad.','You need entries from at least one month.')}</div>`}</div>`;
}

/* ---------- easy backup / restore as text (no file download needed) ---------- */
function bkData(){
  const strip=a=>a.map(x=>({...x,img:(x.img&&String(x.img).startsWith('data:'))?'':(x.img||'')}));
  return JSON.stringify({app:'masrofati',version:2,exportedAt:new Date().toISOString(),tx:strip(S.tx),bills:strip(S.bills),ev:S.ev,goals:S.goals,splits:S.splits,settings:S.settings});
}
function bkFill(){
  $('#bkTitle').textContent=L('نسخ احتياطي واستعادة','Säkerhetskopia och återställning','Backup and restore');
  $('#bkHint').textContent=L('اضغط «نسخ»، ثم الصق النص في ملاحظات هاتفك أو أرسله لنفسك. لا يلزم تنزيل أي ملف. الصور المرفقة لا تدخل في النسخة.','Tryck ”Kopiera” och klistra in texten i anteckningar eller skicka den till dig själv. Ingen filnedladdning behövs. Bifogade bilder ingår inte.','Tap “Copy” and paste the text into your notes or send it to yourself. No file download is needed. Attached images are not included.');
  $('#bkHint2').textContent=L('للاستعادة: الصق النص المنسوخ هنا ثم اضغط «استعادة». تُضاف العمليات الناقصة فقط ولا يُحذف شيء.','För att återställa: klistra in den kopierade texten här och tryck ”Återställ”. Bara saknade poster läggs till, inget tas bort.','To restore: paste the copied text here and tap “Restore”. Only missing entries are added, nothing is removed.');
  $('#bkCopy').textContent=L('نسخ','Kopiera','Copy');$('#bkRestore').textContent=L('استعادة','Återställ','Restore');$('#bkClose').textContent=L('إغلاق','Stäng','Close');
  $('#bkIn').placeholder=L('الصق النسخة الاحتياطية هنا','Klistra in säkerhetskopian här','Paste the backup here');
  $('#bkOut').value=bkData();
}
$('#bkOpen').onclick=()=>{const p=$('#bkPanel');p.hidden=!p.hidden;if(!p.hidden){bkFill();$('#bkMsg').textContent='';p.scrollIntoView({block:'nearest'})}};
$('#bkClose').onclick=()=>{$('#bkPanel').hidden=true};
$('#bkCopy').onclick=async()=>{
  const t=$('#bkOut');t.value=bkData();t.focus();t.select();
  try{await navigator.clipboard.writeText(t.value);$('#bkMsg').textContent=L('تم النسخ','Kopierat','Copied')}
  catch(_){try{document.execCommand('copy');$('#bkMsg').textContent=L('تم تحديد النص، اضغط نسخ من الهاتف','Texten är markerad, kopiera med telefonen','The text is selected, copy it with your phone')}catch(e){$('#bkMsg').textContent=L('حدّد النص وانسخه يدويًا','Markera och kopiera texten manuellt','Select and copy the text manually')}}
};
$('#bkRestore').onclick=async()=>{
  const raw=$('#bkIn').value.trim();if(!raw){toast(L('الصق النسخة أولًا','Klistra in kopian först','Paste the copy first'));return}
  let d;try{d=JSON.parse(raw)}catch(_){toast(L('النص غير صالح. انسخه كاملًا من أوله إلى آخره.','Texten är ogiltig. Kopiera den helt från början till slut.','The text is invalid. Copy it completely from start to end.'));return}
  if(!d||d.app!=='masrofati'||!Array.isArray(d.tx)){toast(L('هذه ليست نسخة من مصروفاتي','Det här är ingen kopia från Mina utgifter','This is not a copy from Mina utgifter'));return}
  const btn=$('#bkRestore');btn.disabled=true;let nt=0,nb=0;
  try{
    const have=new Set(S.tx.map(x=>x.id));
    for(const x of d.tx){if(!x||!x.id||have.has(x.id)||!x.date||!(x.amount>0))continue;const {id,...o}=x;await saveTx(o,id);nt++}
    const haveB=new Set(S.bills.map(x=>x.id));
    for(const b of (d.bills||[])){if(!b||!b.id||haveB.has(b.id)||!b.name)continue;const {id,...o}=b;await saveBill(o,id);nb++}
    for(const e of (d.ev||[])){if(e&&e.id&&!S.ev.some(x=>x.id===e.id))await saveItem('ev',e,e.id)}
    for(const e of (d.splits||[])){if(e&&e.id&&!S.splits.some(x=>x.id===e.id))await saveItem('splits',e,e.id)}
    for(const g of (d.goals||[])){if(g&&g.id&&!S.goals.some(x=>x.id===g.id))await saveItem('goals',g,g.id)}
    if(d.settings){S.settings={...S.settings,budgets:{...(d.settings.budgets||{}),...S.settings.budgets},goal:S.settings.goal||d.settings.goal||null,x:(XL=mergeX(XX(),d.settings.x),saveX(),XL)};try{await saveSettings()}catch(_){}}
    $('#bkIn').value='';render();
    toast(L(`استُعيدت ${nt} عملية و${nb} فاتورة`,`Återställde ${nt} poster och ${nb} räkningar`,`Restored ${nt} entries and ${nb} bills`));
  }catch(e){toast(L('تعذّرت الاستعادة. حاول مرة أخرى.','Återställningen misslyckades. Försök igen.','The restore failed. Try again.'))}
  btn.disabled=false;
};

en:{t:'Privacy Policy',dir:'ltr',h:`<p>Last updated: 2026-10-31</p>
<h2>Who we are</h2><p>The app ”Mina utgifter” (Masrofati) is developed by Dholfoqar Ali. Contact: dholfoqarali@gmail.com.</p>
<h2>What data the app handles</h2><p>Financial entries, bills, budgets and savings goals that you type or import, and images you choose to attach.</p>
<h2>Where it is stored</h2><p>Only on your device (in the browser or app storage). We run no server for your data and cannot see it.</p>
<h2>Reading files</h2><p>Text-based PDF, CSV and TXT files are read on your device and are not sent anywhere. The app uses no AI and sends your data to no service.</p>
<h2>Not advice</h2><p>Tips and calculations in the app are general and for guidance only. They are not financial or tax advice.</p>
<h2>Third-party services</h2><p>The app loads a PDF-reading library from cdnjs (Cloudflare) and fonts from Google Fonts, which may receive your IP address when loading. There are no ads, no tracking and no accounts.</p>
<h2>Backup and deletion</h2><p>A backup is text that you copy and keep yourself. To delete your data, clear the site or app data in your device settings, or uninstall the app.</p>
<h2>Children</h2><p>The app is not directed at children under 13.</p>
<h2>Your rights</h2><p>Because the data is with you and not with us, you control it fully: view, edit and delete it inside the app. For any question, contact us at the email above.</p>
<h2>Changes</h2><p>If this policy changes, we will update the date above.</p>`}};
function showPrivacy(l){
  const p=PV[l]||PV.ar;
  $('#pvTitle').textContent=p.t;$('#pvBody').innerHTML=p.h;$('#pvBody').dir=p.dir;$('#privacyView').dir=p.dir;
  document.querySelectorAll('[data-pv]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pv===l)));
}
function routePrivacy(){
  const on=location.hash==='#privacy';
  document.querySelector('.wrap:not(#privacyView)').hidden=on;$('#privacyView').hidden=!on;
  if(on)showPrivacy(S.lang==='sv'?'sv':(S.lang==='en'?'en':'ar'));
}
document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>showPrivacy(b.dataset.pv));
window.addEventListener('hashchange',routePrivacy);

applyStatic();render();init();routePrivacy();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
